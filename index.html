<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR WhatsApp - Lovable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lovable-pink': '#E83F6F',
                        'lovable-gray': '#4A4A4A',
                        'lovable-dark': '#222222',
                        'lovable-light-pink': '#FCE8EF',
                    },
                    fontFamily: {
                        'sans': ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-100 p-4 flex items-center justify-center">
    <div class="w-full max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-lovable-pink p-6 text-center">
                <div class="flex items-center justify-center mb-2">
                     <img src="https://lovable.com.hn/wp-content/uploads/2021/11/logo-lovable-1.png" alt="Logo Lovable" class="w-24">
                </div>
                <p class="text-white text-sm">Conexión directa - WhatsApp QR</p>
            </div>

            <div class="p-6 space-y-4">
                <div>
                    <label class="flex items-center text-sm font-medium text-lovable-gray mb-2">
                        <span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse" id="statusDot"></span>
                        Token de Acceso
                    </label>
                    <input 
                        type="password" 
                        id="bearerToken" 
                        placeholder="Ingresa tu token de autenticación"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-lovable-pink focus:border-transparent transition-all outline-none"
                    />
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button 
                        onclick="fetchQRCode()"
                        class="bg-lovable-pink text-white font-semibold py-3 px-4 rounded-lg hover:bg-pink-700 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center"
                    >
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Obtener QR
                    </button>
                    <button 
                        onclick="checkStatus()"
                        class="bg-lovable-gray text-white font-semibold py-3 px-4 rounded-lg hover:bg-gray-700 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center"
                    >
                       <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Verificar
                    </button>
                </div>

                <div id="loading" class="hidden">
                    <div class="flex items-center justify-center py-8">
                        <div class="animate-spin rounded-full h-12 w-12 border-4 border-lovable-pink border-t-transparent"></div>
                    </div>
                </div>

                <div id="alertContainer"></div>

                <div id="qrContainer" class="hidden">
                    <div class="bg-lovable-light-pink rounded-xl p-6 text-center">
                        <h3 class="text-lg font-semibold text-lovable-dark mb-4">Escanea para Vincular</h3>
                        <div id="qrCode" class="flex justify-center mb-4"></div>
                        <p class="text-xs text-lovable-gray mb-4">Abre WhatsApp y escanea el código</p>
                    </div>
                </div>
            </div>

            <div class="bg-gray-100 px-6 py-3 text-center">
                <p class="text-xs text-gray-500">
                    <span id="lastUpdate">Sistema Activo</span> • 
                    <a href="https://lovable.com.hn/" target="_blank" class="font-semibold text-lovable-pink hover:underline">Lovable Honduras</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://whatsapp-api-production-1d04.up.railway.app';
        let qrCodeData = '';
        let qrInstance = null;

        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('bearerToken');
            if (savedToken) {
                document.getElementById('bearerToken').value = savedToken;
                updateStatus('connected');
            }
        });

        function updateStatus(status) {
            const dot = document.getElementById('statusDot');
            dot.className = 'inline-block w-2 h-2 rounded-full mr-2 animate-pulse';
            
            switch(status) {
                case 'connected': dot.classList.add('bg-green-500'); break;
                case 'waiting': dot.classList.add('bg-yellow-500'); break;
                default: dot.classList.add('bg-red-500');
            }
        }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const colors = {
                success: 'bg-green-100 text-green-800 border-green-300',
                error: 'bg-red-100 text-red-800 border-red-300',
                info: 'bg-blue-100 text-blue-800 border-blue-300',
                warning: 'bg-yellow-100 text-yellow-800 border-yellow-300'
            };
            
            container.innerHTML = `<div class="${colors[type]} border rounded-lg px-4 py-3 text-sm">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        async function makeRequest(endpoint, method = 'GET') {
            const token = document.getElementById('bearerToken').value.trim();
            if (!token) throw new Error('Por favor, ingresa un token de acceso.');
            localStorage.setItem('bearerToken', token);
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            if (!response.ok) throw new Error(`Error de conexión: ${response.status}`);
            return response;
        }

        async function fetchQRCode() {
            showLoading(true);
            document.getElementById('qrContainer').classList.add('hidden');
            try {
                const response = await makeRequest('/qr');
                const contentType = response.headers.get('content-type');
                
                if (contentType && contentType.includes('json')) {
                    const data = await response.json();
                    showAlert(data.message, 'info');
                    updateStatus('connected');
                } else {
                    const data = await response.text();
                    qrCodeData = data;
                    displayQRCode(data);
                    showAlert('Código QR generado exitosamente.', 'success');
                    updateStatus('waiting');
                }
                updateLastTime();
            } catch (error) {
                showAlert(error.message, 'error');
                updateStatus('disconnected');
            } finally {
                showLoading(false);
            }
        }

        async function checkStatus() {
            try {
                const response = await makeRequest('/estado');
                const data = await response.json();
                const status = data.isAuthenticated ? 'Conectado' : data.hasQR ? 'Esperando escaneo de QR' : 'Desconectado';
                showAlert(`Estado: ${status}`, 'info');
                updateStatus(data.isAuthenticated ? 'connected' : 'waiting');
                if (data.hasQR && !data.isAuthenticated) {
                    fetchQRCode();
                }
            } catch (error) {
                showAlert('Error al verificar el estado de la conexión.', 'error');
            }
        }

        function displayQRCode(qrString) {
            const container = document.getElementById('qrContainer');
            const qrDiv = document.getElementById('qrCode');
            qrDiv.innerHTML = '';
            qrInstance = new QRCode(qrDiv, {
                text: qrString,
                width: 200,
                height: 200,
                colorDark: "#222222",
                colorLight: "#FCE8EF",
                correctLevel: QRCode.CorrectLevel.H
            });
            container.classList.remove('hidden');
        }

        function updateLastTime() {
            const now = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdate').textContent = `Actualizado ${now}`;
        }

        document.getElementById('bearerToken').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchQRCode();
        });

        setInterval(() => {
            if (localStorage.getItem('bearerToken')) {
                checkStatus();
            }
        }, 60000);
    </script>
</body>
</html>
